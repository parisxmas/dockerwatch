[package]
name = "dockerwatch"
version = "0.1.0"
edition = "2021"
description = "Realtime TUI for Docker container CPU & memory usage"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
bollard = "0.18"
futures = "0.3"
anyhow = "1"
humansize = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
